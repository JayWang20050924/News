spring.application.name=news-backend-project
# \u914D\u7F6E\u7AEF\u53E3
server.port=8080
# \u914D\u7F6E\u4E0A\u4E0B\u6587\u8DEF\u5F84
server.servlet.context-path=/api
# 1. \u6570\u636E\u5E93\u8FDE\u63A5\u914D\u7F6E\uFF08\u5BF9\u5E94\u539F\u751FMyBatis\u7684dataSource\uFF09
# \u9A71\u52A8\u7C7B\uFF08MySQL 8.x\u9700\u4F7F\u7528com.mysql.cj.jdbc.Driver\uFF09
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# \u6570\u636E\u5E93\u8FDE\u63A5URL\uFF08\u6CE8\u610F\uFF1Aproperties\u4E2D&\u65E0\u9700\u8F6C\u4E49\uFF0C\u76F4\u63A5\u5199&\u5373\u53EF\uFF09
spring.datasource.url=jdbc:mysql://localhost:3306/wp?useSSL=false&serverTimezone=Asia/Shanghai
# \u6570\u636E\u5E93\u7528\u6237\u540D
spring.datasource.username=root
# \u6570\u636E\u5E93\u5BC6\u7801
spring.datasource.password=123456
# MyBatis\u6838\u5FC3\u914D\u7F6E\uFF08\u5BF9\u5E94\u539F\u751FMyBatis\u7684mappers\u7B49\uFF09
# \u6307\u5B9ASQL\u6620\u5C04\u6587\u4EF6\uFF08UserMapper.xml\uFF09\u7684\u4F4D\u7F6E\uFF08classpath:\u5BF9\u5E94\u8D44\u6E90\u76EE\u5F55\uFF09
