#todo:\u4E0A\u7EBF\u524D\u4F7F\u7528Nacos\u96C6\u4E2D\u7BA1\u7406\u914D\u7F6E
spring.application.name=news-backend-project
# \u914D\u7F6E\u7AEF\u53E3
server.port=8080
# \u914D\u7F6E\u4E0A\u4E0B\u6587\u8DEF\u5F84
server.servlet.context-path=/api

# \u6570\u636E\u5E93\u8FDE\u63A5\u914D\u7F6E
# \u9A71\u52A8\u7C7B\uFF08MySQL 8.x\u9700\u4F7F\u7528com.mysql.cj.jdbc.Driver\uFF09
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# \u6570\u636E\u5E93\u8FDE\u63A5URL
spring.datasource.url=jdbc:mysql://localhost:3306/wp?useSSL=false&serverTimezone=Asia/Shanghai&useAffectedRows=true
# \u6570\u636E\u5E93\u7528\u6237\u540D
spring.datasource.username=root
# \u6570\u636E\u5E93\u5BC6\u7801
spring.datasource.password=123456

# ========== HikariCP \u914D\u7F6E ==========
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1770000
spring.datasource.hikari.pool-name=NewsBackendHikariPool
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# \u5F00\u542FHikariCP\u8C03\u8BD5\u65E5\u5FD7\uFF08\u5F00\u53D1\u73AF\u5883\u7528\uFF0C\u751F\u4EA7\u73AF\u5883\u6539\u4E3AINFO\uFF09
logging.level.com.zaxxer.hikari=INFO
logging.level.com.zaxxer.hikari.HikariPool=INFO

# ===================== MyBatis-Plus \u57FA\u7840\u914D\u7F6E =====================
# Mapper XML \u6587\u4EF6\u8DEF\u5F84
mybatis-plus.mapper-locations=classpath*:mapper/**/*.xml
# \u5B9E\u4F53\u7C7B\u522B\u540D\u5305\uFF08\u4FEE\u590D\uFF1A\u5220\u9664=\u540E\u591A\u4F59\u7A7A\u683C\uFF09
mybatis-plus.type-aliases-package=com.news.backendproject.entity
# \u5F00\u542F\u4E0B\u5212\u7EBF\u8F6C\u9A7C\u5CF0
mybatis-plus.configuration.map-underscore-to-camel-case=true
# \u5F00\u542FMyBatis\u8BE6\u7EC6\u65E5\u5FD7\uFF08\u5F00\u53D1\u73AF\u5883\u7528\uFF09
logging.level.com.baomidou.mybatisplus=DEBUG
logging.level.org.apache.ibatis=DEBUG

# ===================== MyBatis-Plus \u5168\u5C40\u914D\u7F6E =====================
# \u5173\u95ED\u542F\u52A8banner
mybatis-plus.global-config.banner=false
# \u5168\u5C40\u4E3B\u952E\u7B56\u7565\uFF1A\u6570\u636E\u5E93\u81EA\u589E
mybatis-plus.global-config.db-config.id-type=AUTO
# \u903B\u8F91\u5220\u9664\u914D\u7F6E
mybatis-plus.global-config.db-config.logic-delete-field=deleted
mybatis-plus.global-config.db-config.logic-delete-value=1
mybatis-plus.global-config.db-config.logic-not-delete-value=0

# ===================== SQL \u6267\u884C\u914D\u7F6E =====================
# \u5F00\u53D1\u73AF\u5883\uFF1A\u63A7\u5236\u53F0\u6253\u5370 SQL
mybatis-plus.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# SQL \u8D85\u65F6\u65F6\u95F4
mybatis-plus.configuration.default-statement-timeout=30
# NULL \u503C\u7684 JDBC \u7C7B\u578B
mybatis-plus.configuration.jdbc-type-for-null=NULL

# jwt\u5BC6\u94A5
jwt.secret=wzWlafasf234oI10OLli1982MjaASZIIjjlVxX4520fjacxJKlVtrrss1424988
# \u8FC7\u671F\u65F6\u95F4\uFF08\u6BEB\u79D2\uFF09\uFF0C\u6B64\u5904\u4E3A24\u5C0F\u65F6\uFF081000*60*60*24\uFF09
jwt.expiration=86400000
# \u7B7E\u53D1\u4EBA
jwt.issuer=news
# jwt\u7528\u4E8E\u62C9\u9ED1\u7684\u524D\u7F00
jwt.blacklist-prefix=jwt:blacklist

# redis\u914D\u7F6E
spring.data.redis.host=127.0.0.1
spring.data.redis.port=6380
# \u8FDE\u63A5\u8D85\u65F6\u65F6\u95F4
spring.data.redis.timeout=5000
# \u8FDE\u63A5\u6C60\u914D\u7F6E
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1

# ===================== \u7F51\u6613\u90AE\u7BB1SMTP\u914D\u7F6E =====================
