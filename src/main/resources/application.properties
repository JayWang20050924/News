spring.application.name=news-backend-project
# \u914D\u7F6E\u7AEF\u53E3
server.port=8080
# \u914D\u7F6E\u4E0A\u4E0B\u6587\u8DEF\u5F84
server.servlet.context-path=/api

# \u6570\u636E\u5E93\u8FDE\u63A5\u914D\u7F6E\uFF08\u5BF9\u5E94\u539F\u751FMyBatis\u7684dataSource\uFF09
# \u9A71\u52A8\u7C7B\uFF08MySQL 8.x\u9700\u4F7F\u7528com.mysql.cj.jdbc.Driver\uFF09
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# \u6570\u636E\u5E93\u8FDE\u63A5URL
spring.datasource.url=jdbc:mysql://localhost:3306/wp?useSSL=false&serverTimezone=Asia/Shanghai&useAffectedRows=true
# \u6570\u636E\u5E93\u7528\u6237\u540D
spring.datasource.username=root
# \u6570\u636E\u5E93\u5BC6\u7801
spring.datasource.password=123456

# ========== HikariCP \u914D\u7F6E ==========
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1770000
spring.datasource.hikari.pool-name=NewsBackendHikariPool
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=60000

# \u5F00\u542FHikariCP\u8C03\u8BD5\u65E5\u5FD7
logging.level.com.zaxxer.hikari=DEBUG
logging.level.com.zaxxer.hikari.HikariPool=TRACE

# MyBatis\u914D\u7F6E
# \u6307\u5B9ASQL\u6620\u5C04\u6587\u4EF6\uFF08UserMapper.xml\uFF09\u7684\u4F4D\u7F6E\uFF08classpath:\u5BF9\u5E94\u8D44\u6E90\u76EE\u5F55\uFF09
mybatis.mapper-locations=classpath:mapper/UserMapper.xml
# \u5F00\u542FMyBatis\u65E5\u5FD7\uFF08\u65B9\u4FBF\u8C03\u8BD5SQL\uFF09
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl

# jwt\u5BC6\u94A5
jwt.secret=wzWlafasf234oI10OLli1982MjaASZIIjjlVxX4520fjacxJKlVtrrss1424988
# \u8FC7\u671F\u65F6\u95F4\uFF08\u6BEB\u79D2\uFF09\uFF0C\u6B64\u5904\u4E3A24\u5C0F\u65F6\uFF081000*60*60*24\uFF09
jwt.expiration= 86400000
# \u7B7E\u53D1\u4EBA
jwt.issuer=news

# WSL2 \u7684 IP
spring.data.redis.host=127.0.0.1
# Redis \u7AEF\u53E3
spring.data.redis.port=6380
# \u8FDE\u63A5\u8D85\u65F6\u65F6\u95F4
spring.data.redis.timeout=5000
# \u8FDE\u63A5\u6C60\u914D\u7F6E
spring.data.redis.lettuce.pool.max-active=8
spring.data.redis.lettuce.pool.max-idle=8
spring.data.redis.lettuce.pool.min-idle=2
spring.data.redis.lettuce.pool.max-wait=-1

# ===================== \u7F51\u6613\u90AE\u7BB1SMTP\u914D\u7F6E =====================
# SMTP\u670D\u52A1\u5668\u5730\u5740\uFF08163\uFF1Asmtp.163.com\uFF1B126\uFF1Asmtp.126.com\uFF1Byeah.net\uFF1Asmtp.yeah.net\uFF09
spring.mail.host=smtp.163.com
# SMTP\u7AEF\u53E3\uFF08465\uFF1ASSL\u52A0\u5BC6\uFF0C\u63A8\u8350\uFF1B587\uFF1ATLS\u52A0\u5BC6\uFF1B25\uFF1A\u975E\u52A0\u5BC6\uFF0C\u591A\u6570\u670D\u52A1\u5668\u5DF2\u7981\u7528\uFF09
spring.mail.port=465
# \u53D1\u9001\u65B9\u90AE\u7BB1\u5730\u5740
spring.mail.username=global_news@163.com
# SMTP\u6388\u6743\u7801
spring.mail.password=RNV5f35pHbpEGRDJ
# \u90AE\u4EF6\u534F\u8BAE
spring.mail.protocol=smtp
# \u9ED8\u8BA4\u7F16\u7801
spring.mail.default-encoding=UTF-8

# SMTP\u989D\u5916\u914D\u7F6E\uFF08\u5F00\u542F\u8BA4\u8BC1\u548CSSL\u52A0\u5BC6\uFF09
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.properties.mail.smtp.ssl.required=true
# \u4F7F\u7528587\u7AEF\u53E3\uFF08TLS\u52A0\u5BC6\uFF09\u5219\u66FF\u6362\u4E3A\u4EE5\u4E0BTLS\u914D\u7F6E
