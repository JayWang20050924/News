spring.application.name=news-backend-project
server.port=8080
# \u914D\u7F6E\u4E0A\u4E0B\u6587\u8DEF\u5F84
server.servlet.context-path=/api
# 1. \u6570\u636E\u5E93\u8FDE\u63A5\u914D\u7F6E\uFF08\u5BF9\u5E94\u539F\u751FMyBatis\u7684dataSource\uFF09
# \u9A71\u52A8\u7C7B\uFF08MySQL 8.x\u9700\u4F7F\u7528com.mysql.cj.jdbc.Driver\uFF09
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# \u6570\u636E\u5E93\u8FDE\u63A5URL\uFF08\u6CE8\u610F\uFF1Aproperties\u4E2D&\u65E0\u9700\u8F6C\u4E49\uFF0C\u76F4\u63A5\u5199&\u5373\u53EF\uFF09
spring.datasource.url=jdbc:mysql://localhost:3306/wp?useSSL=false&serverTimezone=Asia/Shanghai
# \u6570\u636E\u5E93\u7528\u6237\u540D
spring.datasource.username=root
# \u6570\u636E\u5E93\u5BC6\u7801
spring.datasource.password=123456
# MyBatis\u6838\u5FC3\u914D\u7F6E\uFF08\u5BF9\u5E94\u539F\u751FMyBatis\u7684mappers\u7B49\uFF09
# \u6307\u5B9ASQL\u6620\u5C04\u6587\u4EF6\uFF08UserMapper.xml\uFF09\u7684\u4F4D\u7F6E\uFF08classpath:\u5BF9\u5E94\u8D44\u6E90\u76EE\u5F55\uFF09
mybatis.mapper-locations=classpath:mapper/UserMapper.xml
# \u5F00\u542FMyBatis\u65E5\u5FD7\uFF08\u65B9\u4FBF\u8C03\u8BD5SQL\uFF09
mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
# \u5BC6\u94A5\uFF08\u751F\u4EA7\u73AF\u5883\u9700\u590D\u6742\u4E14\u4FDD\u5BC6\uFF09
jwt.secret=wzWlafasf234oI10OLli1982MjaASZIIjjlVxX4520fjacxJKlVtrrss1424988
# \u8FC7\u671F\u65F6\u95F4\uFF08\u6BEB\u79D2\uFF09\uFF0C\u6B64\u5904\u4E3A24\u5C0F\u65F6\uFF081000*60*60*24\uFF09
jwt.expiration= 86400000
# \u7B7E\u53D1\u4EBA
jwt.issuer=news
# Redis \u670D\u52A1\u5668\u5730\u5740\uFF08\u9ED8\u8BA4 localhost\uFF0C\u8FDC\u7A0B\u670D\u52A1\u5668\u586B IP \u6216\u57DF\u540D\uFF09
spring.data.redis.host=localhost

# Redis \u670D\u52A1\u5668\u7AEF\u53E3\uFF08\u9ED8\u8BA4 6379\uFF0C\u82E5\u4FEE\u6539\u8FC7 Redis \u914D\u7F6E\u5219\u586B\u5BF9\u5E94\u7AEF\u53E3\uFF09
spring.data.redis.port=6379

# \u8FDE\u63A5\u7684 Redis \u6570\u636E\u5E93\u7D22\u5F15\uFF08\u9ED8\u8BA4 0\uFF0CRedis \u652F\u6301 0-15 \u5171 16 \u4E2A\u6570\u636E\u5E93\uFF09
spring.data.redis.database=0

# \u8FDE\u63A5\u8D85\u65F6\u65F6\u95F4\uFF08\u6BEB\u79D2\uFF0C\u9ED8\u8BA4\u65E0\u8D85\u65F6\uFF0C\u5EFA\u8BAE\u8BBE\u7F6E 3-5 \u79D2\uFF09
spring.data.redis.timeout=3000ms

# ------------------------------
# \u5BA2\u6237\u7AEF\u8FDE\u63A5\u6C60\u914D\u7F6E\uFF08\u9ED8\u8BA4\u4F7F\u7528 Lettuce \u5BA2\u6237\u7AEF\uFF09
# ------------------------------

# \u6700\u5927\u6D3B\u8DC3\u8FDE\u63A5\u6570\uFF08\u9ED8\u8BA4 8\uFF0C\u6839\u636E\u5E76\u53D1\u91CF\u8C03\u6574\uFF09
spring.data.redis.lettuce.pool.max-active=8

# \u6700\u5927\u7A7A\u95F2\u8FDE\u63A5\u6570\uFF08\u9ED8\u8BA4 8\uFF0C\u7A7A\u95F2\u65F6\u4FDD\u6301\u7684\u6700\u5927\u8FDE\u63A5\u6570\uFF09
spring.data.redis.lettuce.pool.max-idle=8

# \u6700\u5C0F\u7A7A\u95F2\u8FDE\u63A5\u6570\uFF08\u9ED8\u8BA4 2\uFF0C\u7A7A\u95F2\u65F6\u4FDD\u6301\u7684\u6700\u5C0F\u8FDE\u63A5\u6570\uFF0C\u907F\u514D\u9891\u7E41\u521B\u5EFA\u8FDE\u63A5\uFF09
spring.data.redis.lettuce.pool.min-idle=2

# \u4ECE\u8FDE\u63A5\u6C60\u83B7\u53D6\u8FDE\u63A5\u7684\u6700\u5927\u7B49\u5F85\u65F6\u95F4\uFF08\u6BEB\u79D2\uFF0C\u9ED8\u8BA4 -1 \u8868\u793A\u65E0\u9650\u7B49\u5F85\uFF0C\u5EFA\u8BAE\u8BBE\u7F6E 1-3 \u79D2\uFF09
spring.data.redis.lettuce.pool.max-wait=1500ms